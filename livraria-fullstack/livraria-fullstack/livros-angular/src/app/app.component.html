<main><header><small>ANGULAR + EXPRESS + MONGODB</small><h1>Catálogo de livros</h1><p>Cadastro compartilhado com os outros clientes.</p></header><form (ngSubmit)="incluir()"><input name="titulo" required placeholder="Título" [(ngModel)]="novo.titulo"><input name="autor" required placeholder="Autor" [(ngModel)]="novo.autor"><input name="preco" required type="number" min="0" step=".01" placeholder="Preço" [(ngModel)]="novo.preco"><button>Adicionar</button></form><div class="lista"><p *ngIf="livros.length===0">Nenhum livro cadastrado.</p><article *ngFor="let l of livros"><span><b>{{l.titulo}}</b><small>{{l.autor}} · R$ {{l.preco | number:'1.2-2'}}</small></span><button class="del" (click)="excluir(l._id!)">Excluir</button></article></div></main>
